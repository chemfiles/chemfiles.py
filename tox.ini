[tox]
# https://github.com/tox-dev/tox/issues/3238
requires = tox==4.14.0

envlist =
    lint
    tests

[testenv]
package = external
package_env = build-chemfiles

[testenv:build-chemfiles]
passenv = *
setenv = CHFL_PY_INTERNAL_CHEMFILES = 1

deps =
    wheel
    cmake<4.0
    ninja
    setuptools

commands =
    pip wheel . --no-build-isolation --verbose --no-deps --check-build-dependencies --wheel-dir {envtmpdir}/dist

[testenv:tests]
deps =
    coverage

commands =
    coverage run --source=chemfiles -m unittest discover -s tests -p "*.py"
    coverage xml -o .tox/coverage.xml

[testenv:lint]
package = skip
deps =
    ruff

commands =
    ruff format --diff . --exclude lib
    ruff check . --exclude lib

[testenv:docs]
deps =
    sphinx
    sphinx_bootstrap_theme

commands =
    sphinx-build {posargs:-E} -W -b html docs docs/build/html
