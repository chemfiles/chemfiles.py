[project]
name = "chemfiles"
readme = "README.md"
description = "Read and write computational chemistry files"

dynamic = ["version"]
requires-python = ">=3.7"
license = "BSD-3-Clause"

dependencies = ["numpy"]

authors = [
    { name = "Guillaume Fraux", email = "guillaume@fraux.fr"},
]

keywords = ["chemistry", "computational", "cheminformatics", "files", "formats"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Operating System :: MacOS :: MacOS X",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: Unix",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Chemistry",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: Utilities"
]

[project.urls]
homepage = "https://chemfiles.org"
documentation = "https://chemfiles.org/chemfiles.py"
repository = "https://github.com/chemfiles/chemfiles.py"

### ======================================================================== ###

[build-system]
requires = [
    "setuptools >=77",
    "cmake",
    "ninja",
]
build-backend = "setuptools.build_meta"

[tool.setuptools]
zip-safe = false
packages = ["chemfiles"]
package-dir = { "" = "src" }


### ======================================================================== ###

[tool.black]
line-length = 88
exclude = '''
    /lib |
    /chemfiles/_c_lib.py |
    /doc/conf.py |
'''
